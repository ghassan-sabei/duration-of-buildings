name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', 'manifest.json', 'fb.js', 'icon-*.png', '.github/workflows/apk.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build APK
        env:
          VERSION_CODE: '${{ github.run_number }}'
          APP_ID: com.satcon.buildings
          APP_NAME: دوام البنايات
          APP_REMOTE: https://ghassan-sabei.github.io/duration-of-buildings/
          APP_MARKER: dob_attend_v1
        run: |
          set -o pipefail
          A=android/app/src/main
          rm -rf $A/assets $A/res/mipmap-*
          mkdir -p $A/assets/web $A/assets/lib
          cp index.html manifest.json fb.js icon-192.png icon-512.png $A/assets/web/
          cp -r android/icons/* $A/res/
          gradle -p android clean assembleRelease --no-daemon 2>&1 | tee build.log
          cp android/app/build/outputs/apk/release/app-release.apk duration-of-buildings.apk
      - name: Publish APK release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK ${{ github.run_number }}
          make_latest: true
          files: duration-of-buildings.apk
      - name: Save log to branch
        if: always()
        run: |
          mkdir -p /tmp/out && cp build.log /tmp/out/ 2>/dev/null || echo "no log" > /tmp/out/build.log
          echo "${{ job.status }} run ${{ github.run_number }}" > /tmp/out/status.txt
          cd /tmp/out && git init -q && git checkout -q -b build-log
          git -c user.name=ci -c user.email=ci@local add -A && git -c user.name=ci -c user.email=ci@local commit -qm "build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-log
