name: windows-desktop

# مثبّت ويندوز. يشتغل بس لما يتغير غلاف البرنامج (desktop) أو يدوياً؛
# تعديلات الصفحة توصل للبرنامج المثبّت وحدها بدون مثبّت جديد.
on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: desktop
        run: npm install
      - name: Build
        working-directory: desktop
        run: npx electron-builder --win --publish never
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: win-${{ github.run_number }}
          name: Windows ${{ github.run_number }}
          make_latest: false
          files: desktop/dist/BuildingsAttendance-Setup.exe
      - name: Keep installer on a branch
        shell: bash
        run: |
          mkdir -p /tmp/out && cp desktop/dist/BuildingsAttendance-Setup.exe /tmp/out/
          echo "success run ${{ github.run_number }}" > /tmp/out/status.txt
          cd /tmp/out && git init -q && git checkout -q -b windows
          git -c user.name=ci -c user.email=ci@local add -A && git -c user.name=ci -c user.email=ci@local commit -qm "build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" windows
